\"}[1m])) by (le, uri)))", "legendFormat": "{{uri}}"}], "fieldConfig": {"defaults": {"unit": "s", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}}}, {"id": 4, "title": "HTTP Status Code Distribution", "type": "timeseries", "gridPos": {"x": 12, "y": 10, "w": 12, "h": 10}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"prod\",app=~\"$service\"}[1m])) by (status)", "legendFormat": "{{status}}"}], "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"lineWidth": 2, "fillOpacity": 10, "showPoints": "never"}}}}]}
