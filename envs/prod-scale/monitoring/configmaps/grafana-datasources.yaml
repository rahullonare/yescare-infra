apiVersion: v1
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: "15s"
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo

      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          derivedFields:
            # dev/prod logs are JSON (LogstashEncoder) → match "traceId":"<hex>".
            # Prefer the structured field so the "View Trace" link works on JSON logs.
            - datasourceUid: tempo
              matcherRegex: '"traceId":"([a-f0-9]+)"'
              name: TraceID
              url: '$${__value.raw}'
              urlDisplayLabel: "View Trace"
            # Fallback for any plain-text [traceId=...] lines (local-style format)
            - datasourceUid: tempo
              matcherRegex: '\[traceId=([a-f0-9]+)\]'
              name: TraceID
              url: '$${__value.raw}'
              urlDisplayLabel: "View Trace"

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags: [{ key: "app" }]
            filterByTraceID: true
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
kind: ConfigMap
