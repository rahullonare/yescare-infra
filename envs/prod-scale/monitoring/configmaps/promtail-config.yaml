apiVersion: v1
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods-dev
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [prod]
        pipeline_stages:
          # 1. Unwrap the containerd CRI envelope ("<ts> stdout F <payload>") so the
          #    remaining stages see the raw application log line. Required on DOKS (containerd).
          - cri: {}
          # 2. dev/prod profiles log structured JSON (LogstashEncoder). Extract traceId/spanId
          #    so Loki streams can correlate with Tempo. A non-JSON line (e.g. a third-party
          #    pod) simply yields no extraction — the line is still shipped, never dropped.
          - json:
              expressions:
                traceId: traceId
                spanId: spanId
          - labels:
              traceId:
        relabel_configs:
          # Drop pods without an app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: .+
          # Use pod UID + container name to find the log path on the node
          - source_labels:
              [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
          # Labels for Loki streams
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
